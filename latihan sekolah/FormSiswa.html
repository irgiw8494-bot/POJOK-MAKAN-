<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css" type="text/css">
</head>
<body>
    <table>
        <form action="">
        <!-- JUDUL -->
        <h1 style="text-align: center;">FORMULIR DATA MURID<hr></h1>

        <!-- GAMBAR -->
        <img src="stikmaslogo.png" alt="logosekolah" style="display: block; margin-left: auto; margin-right: auto; width: 200px;">
        
        <!-- FORMULIR -->
        <table style="margin-left: auto ; margin-right: auto;">
        <tr>
            <td><label for="nama">Nama Lengkap</label></td>
            <td>:</td>
            <td><input type="text" placeholder="Masukan nama lengkap"></td>
        </tr>
        <tr>
            <td><label for="tanggal lahir">Tanggal Lahir</label></td>
            <td>:</td>
            <td><input type="date" placeholder="Masukan tanggal lahir"></td>
        </tr>
        <tr>
            <td><label for="Umur">Umur</label></td>
            <td>:</td>
            <td><input type="number" placeholder="Masukan umur kamu"></td>
        </tr>
        <tr>
            <td><label for="Password">Paswword</label></td>
            <td>:</td>
            <td><input type="password" placeholder="Masukan password anda"></td>
        </tr>
        <tr>
            <td><label for="Kelas">Kelas</label></td>
            <td>:</td>
            <td>
                <select name="Kelas" id="kelas">Kelas
                <option value="X.PPLG">X.PPLG</option>
                <option value="XI.PPLG">XI.PPLG</option>
                <option value="XII.PPLG">XII.PPLG</option>
                </select>
                </td>
        </tr>
        <tr>
            <td><label for="Jenis Kelamin">Jenis Kelamin</label></td>
            <td>:</td>
            <td><input type="radio" name="kelamin" value="laki-laki" id="laki-laki">
                <label for="kelamin">Laki-laki</label>
                <input type="radio" name="kelamin" value="Perempuan" id="perempuan">
                <label for="kelamin">Perempuan</label>
                </td>
        </tr>
        <tr>
            <td><label for="Hobi">Hobi</label></td>
            <td>:</td>
            <td><Input type="checkbox" name="hobi" value="Coding">Coding</Input>
                <Input type="checkbox" name="hobi" value="Coding">Futsal</Input>
                <Input type="checkbox" name="hobi" value="Coding">Main game</Input>
                <Input type="checkbox" name="hobi" value="Coding">Makan</Input>
                <Input type="checkbox" name="hobi" value="Coding">Minum</Input>
                <Input type="checkbox" name="hobi" value="Coding">Tidur</Input>
                <Input type="checkbox" name="hobi" value="Coding">Mendengarkan musik</Input>
            </td>
        </tr>
        <tr>
            <td><button type="submit">Kirim</button></td>
            <td>:</td>
            <td><button type="reset">Reset</button></td>
            

        </tr>
    </table>
    </form>
</body>
</html>
