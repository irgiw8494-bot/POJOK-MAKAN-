<!DOCTYPE html>
<html>
<head>
    <title>Hitung Harga Barang</title>
</head>
<body>

    <h2>Menghitung Total Harga Barang</h2>

    <form>
        <label>Nama Barang:</label>
        <input type="text" id="namaBarang">
        <br><br>

        <label>Jumlah Barang:</label>
        <input type="number" id="jumlah">
        <br><br>

        <label>Harga Satuan:</label>
        <input type="number" id="harga">
        <br><br>

        <button type="button" onclick="hitungTotal()">
            Hitung Total
        </button>
    </form>

    <hr>

    <div id="hasil"></div>

    <script>
        function hitungTotal() {

            let namaBarang = document.getElementById("namaBarang").value;
            let jumlah = document.getElementById("jumlah").value;
            let harga = document.getElementById("harga").value;

            let total = jumlah * harga;

            document.getElementById("hasil").innerHTML =
                "Nama Barang: " + namaBarang + "<br>" +
                "Jumlah Barang: " + jumlah + "<br>" +
                "Harga Satuan: Rp" + harga + "<br>" +
                "<strong>Total Harga: Rp" + total + "</strong>";
        }
    </script>

</body>
</html>
